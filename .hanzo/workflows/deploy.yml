name: build
on:
  push:
    branches: [main]
    # A docs or workflow edit is not a new image. Without this, every such commit
    # trips the "version already exists" guard below and reports a RED build for
    # a change that could not possibly produce a release — training everyone to
    # ignore red. Real source changes still build; use workflow_dispatch to force.
    paths-ignore:
      - '**.md'
      - 'LLM.md'
      - 'CLAUDE.md'
      - '.github/**'
      - '.hanzo/workflows/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# This pipeline BUILDS. It does not deploy, and it must not try.
#
# App/id is governed by Hanzo CD: `id.yaml` is listed in
# universe/infra/k8s/operator/crs/kustomization.yaml and the live object carries
# `apps.hanzo.ai/tracking-id`. A `kubectl patch` of that CR is therefore reverted
# on the next sync (~60-90s) back to whatever git says — which is exactly what
# this workflow used to do, so its "deploy" step could never stick. Worse, it
# LOOKED like it worked: the patch applies, the pod rolls, and CD quietly puts
# the old tag back a minute later.
#
# Build and deploy are separate concerns. This emits an immutable image; git
# declares desired state; CD applies it. To ship a build, set `spec.image.tag`
# in universe/infra/k8s/operator/crs/id.yaml and push — that is the ONE way a
# tag reaches this cluster.
jobs:
  build:
    # The pool the runners ACTUALLY advertise. They register
    # `hanzo-build-linux-amd64` (plus the ubuntu-* aliases); there is no
    # `hanzo-linux-amd64` label anywhere in the fleet, which this targeted before
    # — so no runner could ever match and Gitea created NO RUN AT ALL. Four
    # commits landed on main between 2026-07-23 and 2026-07-25 and produced zero
    # images, silently. Same label as hanzoai/app, which has 299 green runs.
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      # ghcr auth, the piece the previous raw `buildctl` invocation lacked: it
      # pushed with no registry login at all, so every run died on
      # `https://ghcr.io/v2/: denied: denied`. GH_PAT (write:packages, user
      # hanzo-dev) is an ORG-level secret on hanzoai and is inherited here — same
      # as hanzoai/app and hanzoai/cloud.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      # oci.hanzo.ai is OUR registry and the destination for every image. It is
      # the same registry.hanzo.ai backend under a second hostname, gated by IAM
      # token auth (realm https://iam.hanzo.ai/v1/iam/registry/token). Creds are
      # ORG-level secrets sourced from the KMS-synced registry credential.
      - name: Log in to oci.hanzo.ai
        uses: docker/login-action@v3
        with:
          registry: oci.hanzo.ai
          username: ${{ secrets.OCI_USER }}
          password: ${{ secrets.OCI_TOKEN }}

      # SEMVER, never a sha and never a floating tag. package.json is the single
      # source of the version, so a release IS a version bump: edit the version,
      # push, and the image that appears is named after it. Building an existing
      # version again is refused rather than silently overwriting a tag other
      # environments may already be pinning.
      - name: Resolve version from package.json
        id: ver
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          case "$v" in
            ''|*[!0-9.]*) echo "package.json version is not plain semver: '$v'" >&2; exit 1 ;;
          esac
          if docker manifest inspect "ghcr.io/hanzoai/id:${v}" >/dev/null 2>&1; then
            echo "ghcr.io/hanzoai/id:${v} already exists — bump the version to cut a release" >&2
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "building ghcr.io/hanzoai/id:${v}"

      - name: Build + push ghcr.io/hanzoai/id
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # BOTH registries, one build. oci.hanzo.ai is where images are moving;
          # ghcr stays until a pull credential naming oci.hanzo.ai exists in the
          # cluster (k8s matches imagePullSecrets by HOSTNAME, and the KMS-synced
          # registry-credentials secret currently only carries registry.hanzo.ai
          # — so a CR pointed at oci.hanzo.ai today would ImagePullBackOff).
          # Publishing to both means the CR flip is one line whenever that lands.
          tags: |
            oci.hanzo.ai/id:${{ steps.ver.outputs.version }}
            ghcr.io/hanzoai/id:${{ steps.ver.outputs.version }}
          provenance: false

      # build-push-action can exit 0 while the manifest is not yet resolvable at
      # the registry. Prove the image actually pulls before anyone bumps a CR to
      # it, so a partial push fails HERE instead of becoming an ImagePullBackOff.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.version }}"
          for ref in "oci.hanzo.ai/id:${tag}" "ghcr.io/hanzoai/id:${tag}"; do
            ok=""
            for i in 1 2 3 4 5 6; do
              if docker manifest inspect "$ref" >/dev/null 2>&1; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "image $ref did not resolve after push" >&2
              exit 1
            fi
            echo "$ref resolves"
          done
          echo "to ship it: set spec.image.tag to ${tag} in universe crs/id.yaml and push"
