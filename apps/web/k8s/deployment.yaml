# Hanzo ID — brand-neutral identity portal. Single Deployment serves
# any identity host. Tenant resolution is per-request by hostname; the
# runtime tenant catalog lives in the `id-tenant-catalog` ConfigMap and
# is templated into /config.json by the spa runtime at boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id
  namespace: hanzo
  labels:
    app: id
    app.kubernetes.io/name: id
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: id
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: id
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [id]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: id
          image: ghcr.io/hanzoai/id:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: id-tenant-catalog
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: id
  namespace: hanzo
  labels:
    app: id
    app.kubernetes.io/name: id
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  selector:
    app: id
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
