# Hanzo ID — runtime tenant catalog.
#
# Brand-neutral image: zero brand-specific data is bundled. This ConfigMap
# carries the per-host overrides — `orgId`, `brandUrl`, `clientId`. The
# image's hostname-derived defaults handle everything else (and would
# handle the simple cases here too — `hanzo.id` → org=`hanzo` — but the
# org-vs-npm-scope mismatches (`lux` → `@luxfi/brand`, `pars` → `@parsdao/brand`,
# `zoolabs.id` → org=`zoo` (not `zoolabs`), etc.) require explicit overrides).
#
# Hanzo-ID-specific deploys (Liquidity, ad.nexus, bootno.de, etc.) ship
# their own ConfigMap with their own host map. The image never changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: id-tenant-catalog
  namespace: hanzo
  labels:
    app: id
    app.kubernetes.io/name: id
    app.kubernetes.io/part-of: platform
data:
  SPA_IAM_TENANT_CONFIG_JSON: |
    {
      "hanzo.id":         {"orgId":"hanzo","clientId":"hanzo-id-portal","appName":"hanzo-id","brandUrl":"https://cdn.jsdelivr.net/npm/@hanzo/brand@latest/brand.json"},
      "lux.id":           {"orgId":"lux",  "clientId":"lux-id-portal",  "appName":"lux-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@luxfi/brand@latest/brand.json"},
      "id.lux.network":   {"orgId":"lux",  "clientId":"lux-id-portal",  "appName":"lux-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@luxfi/brand@latest/brand.json"},
      "iam.lux.network":  {"orgId":"lux",  "clientId":"lux-id-portal",  "appName":"lux-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@luxfi/brand@latest/brand.json"},
      "zoolabs.id":       {"orgId":"zoo",  "clientId":"zoo-id-portal",  "appName":"zoo-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@zooai/brand@latest/brand.json"},
      "www.zoolabs.id":   {"orgId":"zoo",  "clientId":"zoo-id-portal",  "appName":"zoo-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@zooai/brand@latest/brand.json"},
      "id.zoo.network":   {"orgId":"zoo",  "clientId":"zoo-id-portal",  "appName":"zoo-id",  "brandUrl":"https://cdn.jsdelivr.net/npm/@zooai/brand@latest/brand.json"},
      "pars.id":          {"orgId":"pars", "clientId":"pars-id-portal", "appName":"pars-id", "brandUrl":"https://cdn.jsdelivr.net/npm/@parsdao/brand@latest/brand.json"},
      "id.pars.network":  {"orgId":"pars", "clientId":"pars-id-portal", "appName":"pars-id", "brandUrl":"https://cdn.jsdelivr.net/npm/@parsdao/brand@latest/brand.json"},
      "osage.id":         {"orgId":"osage","clientId":"osage-id-portal","appName":"osage-id","brandUrl":"https://cdn.jsdelivr.net/npm/@osage/brand@latest/brand.json"},
      "www.osage.id":     {"orgId":"osage","clientId":"osage-id-portal","appName":"osage-id","brandUrl":"https://cdn.jsdelivr.net/npm/@osage/brand@latest/brand.json"}
    }
