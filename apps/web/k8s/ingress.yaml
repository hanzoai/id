# Hanzo ID — one Ingress, four hosts. Each host's `tls.secretName` is a
# cert-manager-issued Secret (Let's Encrypt DNS-01 via Cloudflare).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: id
  namespace: hanzo
  annotations:
    kubernetes.io/ingress.class: ingress
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: hanzo.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: id, port: { number: 80 } } }
    - host: lux.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: id, port: { number: 80 } } }
    - host: zoo.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: id, port: { number: 80 } } }
    - host: pars.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: id, port: { number: 80 } } }
  tls:
    - hosts: [hanzo.id]
      secretName: hanzo-id-tls
    - hosts: [lux.id]
      secretName: lux-id-tls
    - hosts: [zoo.id]
      secretName: zoo-id-tls
    - hosts: [pars.id]
      secretName: pars-id-tls
