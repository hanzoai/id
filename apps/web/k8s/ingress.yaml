# Hanzo ID — one Ingress, all white-label identity hosts.
# Each `tls.secretName` is a cert-manager-issued Secret (DNS-01 via Cloudflare).
# Adding a host: append to `rules` + `tls` + tenant.ts DEFAULT_TENANTS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-cf
    kubernetes.io/ingress.class: ingress
  name: id
  namespace: hanzo
spec:
  rules:
  - host: hanzo.id
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  - host: lux.id
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  - host: id.lux.network
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  - host: iam.lux.network
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  - host: pars.id
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  - host: id.zoo.network
    http:
      paths:
      - backend: {service: {name: id, port: {number: 80}}}
        path: /
        pathType: Prefix
  tls:
  - hosts: [hanzo.id]
    secretName: hanzo-id-tls
  - hosts: [lux.id]
    secretName: lux-id-tls
  - hosts: [id.lux.network]
    secretName: id-lux-network-tls
  - hosts: [iam.lux.network]
    secretName: iam-lux-network-tls
  - hosts: [pars.id]
    secretName: pars-id-tls
  - hosts: [id.zoo.network]
    secretName: id-zoo-network-tls
