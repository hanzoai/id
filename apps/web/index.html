<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- ONE icon link, and it starts EMPTY. This file is served byte-identical to
         hanzo.id, lux.id, zoolabs.id and pars.id, so a same-origin default here is
         one brand's mark on every other brand's tab — which is what shipped: all
         three of these pointed at Hanzo assets, and lux.id drew the Hanzo mark.
         `App.tsx` sets the href from the resolved brand.

         The .ico is gone rather than swapped. `sizes="any"` makes it the browser's
         preferred candidate over a typed SVG, so it won the pick and the runtime
         swap changed a link nothing was reading — the reason this looked unfixed
         while the code that fixes it was already running. apple-touch-icon went
         with it for the same reason it could not be white-labelled. -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:," />
    <title>Sign in</title>
    <!-- The stored reading, applied BEFORE the stylesheet paints. Without it the
         page paints at the default and jumps when the bundle runs, which on the
         sign-in page is the first thing a returning person sees. It is a literal
         because it has to run ahead of any module; it reads the one key
         @hanzo/appearance writes, and the app applies the same value again on
         mount, so this only has to be early, not clever. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('hanzo.appearance') || '{}')
          if (typeof p.type === 'number')
            document.documentElement.style.setProperty(
              '--type-scale',
              String(Math.min(1.4, Math.max(0.85, p.type)))
            )
          var d = { compact: '0.85', default: '1', comfortable: '1.15' }[p.density]
          if (d) document.documentElement.style.setProperty('--density', d)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
