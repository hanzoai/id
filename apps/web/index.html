<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- One icon link, and it starts empty: this file is served unchanged on every
         identity host, so any default here would be one brand's icon on every
         other brand's tab. `App.tsx` sets the href from the resolved brand.
         There is no .ico and no apple-touch-icon, because the browser prefers
         those over a typed SVG and they cannot follow the resolved brand. -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:," />
    <title>Sign in</title>
    <!-- The stored reading, applied before the stylesheet paints, so a returning
         person's page does not jump when the bundle runs. It is inline because it
         has to run ahead of any module; it reads the key the appearance package
         writes, and the app applies the same value again on mount. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('hanzo.appearance') || '{}')
          if (typeof p.type === 'number')
            document.documentElement.style.setProperty(
              '--type-scale',
              String(Math.min(1.4, Math.max(0.85, p.type)))
            )
          var d = { compact: '0.85', default: '1', comfortable: '1.15' }[p.density]
          if (d) document.documentElement.style.setProperty('--density', d)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
